---
- name: Prepare
  hosts: instance
  gather_facts: false
  tasks:
    - name: Bootstrap the container
      ansible.builtin.include_tasks:
        file: ../utils/tasks/bootstrap.yml

- name: Prepare the database
  hosts: localhost
  gather_facts: false
  vars:
    molecule_mariadb_container: icinga2-web-db
  tasks:
    - name: Set up tls for mariadb
      ansible.builtin.include_tasks:
        file: ../utils/tasks/mariadb_tls.yml

- name: Prepare the database connection
  hosts: instance
  become: true
  vars:
    molecule_mariadb_host: icinga2-web-db
  tasks:
    - name: Trust the mariadb certificate
      ansible.builtin.include_tasks:
        file: ../utils/tasks/trust_mariadb.yml

    # The role creates symbolic links to these module directories
    # unconditionally, but nothing installs the modules.
    - name: Create stub directories for the icingaweb2 modules
      ansible.builtin.file:
        path: /usr/share/icingaweb2/modules/{{ item }}
        state: directory
        mode: "0755"
      loop:
        - director
        - incubator
        - reporting
        - icingadb
