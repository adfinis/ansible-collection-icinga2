---
driver:
  name: default

platforms:
  - name: icinga2-master
    image: "docker.io/geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    groups:
      - instance
      - monitoring_master

  - name: icinga2-master-db
    image: docker.io/library/mariadb:11.8
    systemd: false
    volumes:
      - icinga2-master-db-tls:/etc/mysql/tls
      - icinga2-master-db-conf:/etc/mysql/conf.d
    env:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: icinga2
      MARIADB_USER: icinga2
      MARIADB_PASSWORD: passw0rd
    groups:
      - db

provisioner:
  name: ansible
  playbooks:
    create: ../utils/playbooks/create.yml
    destroy: ../utils/playbooks/destroy.yml
  inventory:
    hosts:
      all:
        children:
          # The role expects these groups to exist in the inventory.
          monitoring_sat:
            hosts: {}
          monitoring_client:
            hosts: {}
    group_vars:
      all:
        ansible_connection: containers.podman.podman
      monitoring_master:
        icinga2_master_client_parent_zone: monitoring-master

scenario:
  # No idempotence for now. the role is not idempotent on the second run
  # because "icinga2 api setup" rewrites the templated configuration files.
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - verify
    - destroy
