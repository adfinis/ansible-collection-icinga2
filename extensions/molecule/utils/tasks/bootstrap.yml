---
# The container images are minimal Debian installations. Install the packages
# required by the ansible modules and facts used in the roles before the first
# fact gathering happens.
- name: Update the package cache # noqa: command-instead-of-module
  ansible.builtin.command: apt-get update
  changed_when: true

- name: Install packages required by the roles # noqa: command-instead-of-module
  ansible.builtin.command: apt-get install --yes python3-apt lsb-release gnupg
  changed_when: true
