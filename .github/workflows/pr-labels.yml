---
name: PR labels

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  check_label:
    permissions:
      checks: write
      contents: write
      pull-requests: write
    uses: ansible/ansible-content-actions/.github/workflows/check_label.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
