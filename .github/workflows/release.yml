    uses: ansible/ansible-content-actions/.github/workflows/release_galaxy.yaml@7dc7e15a53c2ae8bd092461e53dafd6627e34ac6 # v1.1.0
    with:
      environment: release
    secrets:
      ansible_galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
