---
release_summary: >
  Initial release of the ``adfinis.icinga2`` collection, consolidating the
  standalone roles ``adfinis.icinga2_agent``, ``adfinis.icinga2_client``,
  ``adfinis.icinga2_master`` and ``adfinis.icinga2_web`` with their full git
  histories. Role names and variables are unchanged; role dependencies now use
  collection FQCNs (e.g. ``adfinis.icinga2.icinga2_agent``).