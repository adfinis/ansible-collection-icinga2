ancestor:
releases:
  0.1.1:
    changes: {}
    release_date: "2026-08-03"
  0.1.0:
    changes:
      bugfixes:
        - icinga2_web - fix the ``when`` condition of "Insert icingaweb2 admin password
          into database", which errored out on fresh installations because the registered
          result of the password hash task has no ``skipped`` key when the task actually
          ran.
      minor_changes:
        - all roles now use the ansible_facts directory instead of the deprecated,
          injected variables.
      release_summary:
        "Initial release of the ``adfinis.icinga2`` collection, consolidating
        the standalone roles ``adfinis.icinga2_agent``, ``adfinis.icinga2_client``,
        ``adfinis.icinga2_master`` and ``adfinis.icinga2_web`` with their full git
        histories. Role names and variables are unchanged; role dependencies now use
        collection FQCNs (e.g. ``adfinis.icinga2.icinga2_agent``).\n"
    fragments:
      - ansible-facts.yml
      - icinga2_web-admin-password-when-condition.yml
      - initial-collection-release.yml
    release_date: "2026-08-03"
