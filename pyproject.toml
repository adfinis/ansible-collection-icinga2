[project]
name = "adfinis-icinga2-dev"
version = "0.0.0"
description = "Development and test environment for the adfinis.icinga2 Ansible collection."
requires-python = ">=3.12"

[dependency-groups]
test = [
    "pytest==9.1.1",
    "pytest-ansible==26.10.0",
    "pytest-xdist==3.8.0",
]
dev = [
    { include-group = "test" },
    "ansible==14.5.0",
    "ansible-lint==26.10.1",
    "yamllint==1.38.0",
    "molecule==26.10.0",
    "ruff==0.17.2",
    "pre-commit==4.7.0",
    "antsibull-changelog==0.36.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Ansible plugins must place imports below DOCUMENTATION/EXAMPLES/RETURN
"plugins/modules/*.py" = ["E402"]
"plugins/filter/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["ansible_collections.adfinis.icinga2"]
lines-after-imports = 2

[tool.pytest.ini_options]
addopts = ["-vvv", "--log-level", "WARNING", "--color", "yes"]
filterwarnings = ["ignore:AnsibleCollectionFinder has already been configured"]
testpaths = ["tests"]
